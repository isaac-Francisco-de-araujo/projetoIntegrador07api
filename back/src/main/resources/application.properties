spring.application.name=rota-brasil
spring.profiles.default=desenvolvimento
spring.datasource.url=jdbc:h2:file:./database/rotabrasil;IFEXISTS=TRUE;DB_CLOSE_DELAY=-1;WRITE_DELAY=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
rotabrasil.arquivos.viagens=arquivos/viagens
# SMTP intentionally not configured until the server details are provided.
rotabrasil.email.modo=SIMULADO
rotabrasil.email.limite-arquivo-bytes=20971520
rotabrasil.email.limite-total-bytes=104857600

# DTOs são materializados no serviço; não manter sessão JPA na camada HTTP.
spring.jpa.open-in-view=false
# Recusar campos que não pertencem ao contrato de entrada.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Raiz adicional, autorizada externamente, no computador do backend (não do navegador).
# Deve existir, ser gravável e estar separada do acervo interno. Vazio desabilita o destino.
rotabrasil.exportacao.raiz=${ROTABRASIL_EXPORTACAO_RAIZ:}

# Revalidar HTML e módulos juntos; não reutilizar silenciosamente frontend de outro JAR.
spring.web.resources.cache.cachecontrol.no-store=true

# Confirmação manual ao motorista é independente do envio documental ao cliente.
rotabrasil.notificacoes.modo=SIMULADO
rotabrasil.notificacoes.tipo-conta=NAO_IDENTIFICADA
