spring.application.name=rota-brasil
spring.datasource.url=jdbc:h2:file:./database/rotabrasil;IFEXISTS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
rotabrasil.arquivos.viagens=arquivos/viagens
# SMTP intentionally not configured until the server details are provided.

# DTOs são materializados no serviço; não manter sessão JPA na camada HTTP.
spring.jpa.open-in-view=false
# Recusar campos que não pertencem ao contrato de entrada.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
