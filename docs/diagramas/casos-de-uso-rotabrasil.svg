an x="435" dy="23">viagens e documentos</tspan></text><path d="M104,266 L217,375" class="line"/><ellipse cx="435" cy="375" rx="218" ry="32" fill="#e8f2ed" stroke="#367764" stroke-width="2" /><text x="435" y="369" text-anchor="middle" class="label"><tspan x="435" dy="0">Excluir cadastros sem vínculos;</tspan><tspan x="435" dy="23">arquivar / restaurar documentos</tspan></text><path d="M104,266 L217,440" class="line"/><ellipse cx="435" cy="440" rx="218" ry="32" fill="#e8f2ed" stroke="#367764" stroke-width="2" /><text x="435" y="434" text-anchor="middle" class="label"><tspan x="435" dy="0">Selecionar destinatário/anexos</tspan><tspan x="435" dy="23">e gerar prévia sem envio</tspan></text><text x="450" y="526" text-anchor="middle" class="small"><tspan x="450" dy="0">A prévia atual termina na conferência. Nenhum e-mail é enviado.</tspan></text><rect x="180" y="560" width="510" height="455" rx="12" fill="#fffdfa" stroke="#ad762b" stroke-width="2" stroke-dasharray="8 5"/><text x="435" y="591" text-anchor="middle" class="small"><tspan x="435" dy="0">SISTEMA ESPERADO — CONTINUIDADE</tspan></text><g stroke="#245d54" stroke-width="2.5" fill="none"><circle cx="80" cy="798" r="10"/><path d="M80,808v32 m-24,-20 h48 m-24,20 l-19,27 m19,-27 l19,27"/></g><text x="80" y="892" text-anchor="middle" class="small"><tspan x="80" dy="0">Operador</tspan></text><ellipse cx="435" cy="645" rx="218" ry="32" fill="#fff7e8" stroke="#ad762b" stroke-width="2" stroke-dasharray="7 5"/><text x="435" y="639" text-anchor="middle" class="label"><tspan x="435" dy="0">Receber ZIP automaticamente</tspan><tspan x="435" dy="23">pelo canal definido</tspan></text><ellipse cx="435" cy="725" rx="218" ry="32" fill="#fff7e8" stroke="#ad762b" stroke-width="2" stroke-dasharray="7 5"/><text x="435" y="719" text-anchor="middle" class="label"><tspan x="435" dy="0">Obter o destinatário</tspan><tspan x="435" dy="23">pela fonte confirmada</tspan></text><ellipse cx="435" cy="805" rx="218" ry="32" fill="#fff7e8" stroke="#ad7