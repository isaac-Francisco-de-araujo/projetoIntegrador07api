spring.application.name=rota-brasil
spring.datasource.url=jdbc:h2:mem:rotabrasil;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
rotabrasil.arquivos.viagens=arquivos/viagens
# SMTP intentionally not configured until the server details are provided.
