name: Verificação RotaBrasil
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Testes isolados (symlink obrigatório no Linux)
        run: mvn -B "-Drotabrasil.build.directory=${{ runner.temp }}/rotabrasil-build" clean test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auxiliares Python sem sobrescrita
        run: python -m unittest discover -s python -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.os }}
          path: ${{ runner.temp }}/rotabrasil-build/surefire-reports
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts
      - run: npx --prefix scripts playwright install --with-deps chromium
      - run: mvn -B "-Drotabrasil.build.directory=${{ runner.temp }}/rotabrasil-build" -DskipTests clean package
      - name: Fluxo manual e diagnóstico, sem SMTP real
        env:
          ROTABRASIL_BROWSER_CHANNEL: chromium
        run: node scripts/testar-envio-manual.cjs "${{ runner.temp }}/rotabrasil-build/rota-brasil-0.0.1-SNAPSHOT.jar" "${{ runner.temp }}/rotabrasil-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navegador
          path: ${{ runner.temp }}/rotabrasil-ui
